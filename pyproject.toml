[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swmm-pipe-surrogate-demo"
version = "0.1.0"
description = "Clean synthetic-data demonstration of a Pipe GraphWaveNet surrogate"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "torch>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
